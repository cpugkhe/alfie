<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ccfdc"/>
      <stop offset="1" stop-color="#6f9fc0"/>
    </linearGradient>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <clipPath id="head"><path d="M512 262c150 0 262 104 262 262 0 176-112 300-262 300S250 700 250 524c0-158 112-262 262-262Z"/></clipPath>
  </defs>

  <!-- macOS-style rounded tile -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>

  <g clip-path="url(#tile)">
    <!-- white chest ruff peeking up from the bottom -->
    <path d="M330 924c20-110 90-170 182-170s162 60 182 170Z" fill="#eceff4"/>

    <!-- floppy ears -->
    <path d="M300 330c-70-60-150-40-176 26 6 104 62 186 150 226 10-96 22-176 26-252Z" fill="#14161b"/>
    <path d="M724 330c70-60 150-40 176 26-6 104-62 186-150 226-10-96-22-176-26-252Z" fill="#14161b"/>
    <path d="M236 372c-34-8-64 2-84 26 12 62 44 112 92 144 0-62 0-116-8-170Z" fill="#c8844a" opacity=".55"/>
    <path d="M788 372c34-8 64 2 84 26-12 62-44 112-92 144 0-62 0-116 8-170Z" fill="#c8844a" opacity=".55"/>

    <!-- head -->
    <path d="M512 262c150 0 262 104 262 262 0 176-112 300-262 300S250 700 250 524c0-158 112-262 262-262Z" fill="#14161b"/>

    <g clip-path="url(#head)">
      <!-- copper cheeks -->
      <ellipse cx="362" cy="668" rx="128" ry="112" fill="#c8844a"/>
      <ellipse cx="662" cy="668" rx="128" ry="112" fill="#c8844a"/>
      <!-- white blaze running into the muzzle -->
      <path d="M512 250c-34 70-44 150-52 226-10 90-76 130-76 220 0 86 56 140 128 140s128-54 128-140c0-90-66-130-76-220-8-76-18-156-52-226Z" fill="#eceff4"/>
    </g>

    <!-- copper eyebrow dots -->
    <ellipse cx="398" cy="432" rx="30" ry="22" fill="#c8844a"/>
    <ellipse cx="626" cy="432" rx="30" ry="22" fill="#c8844a"/>

    <!-- eyes -->
    <circle cx="398" cy="506" r="33" fill="#a9682c"/>
    <circle cx="626" cy="506" r="33" fill="#a9682c"/>
    <circle cx="398" cy="506" r="18" fill="#0b0c0f"/>
    <circle cx="626" cy="506" r="18" fill="#0b0c0f"/>
    <circle cx="408" cy="496" r="7" fill="#fff"/>
    <circle cx="636" cy="496" r="7" fill="#fff"/>

    <!-- nose and smile -->
    <path d="M512 610c36 0 62 14 62 36 0 26-34 48-62 48s-62-22-62-48c0-22 26-36 62-36Z" fill="#14161b"/>
    <ellipse cx="496" cy="632" rx="14" ry="8" fill="#fff" opacity=".28"/>
    <path d="M512 694v34m0 0c-18 34-58 38-82 14m82-14c18 34 58 38 82 14" fill="none" stroke="#14161b" stroke-width="13" stroke-linecap="round"/>
    <!-- tongue -->
    <path d="M486 752c0 34 12 54 26 54s26-20 26-54c-8 8-18 10-26 0-8 10-18 8-26 0Z" fill="#d9778a"/>
  </g>
</svg>
